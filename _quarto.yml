project:
  type: book
  #output-dir: docs    # use this output dir for anything updated on the public site
  output-dir: _book

# do not show output of code chunks - outside errors
execute:
  echo: false
  warning: false

book:
  title: "Operational Comparison of ANS Performance"
  author: "DECEA Performance Section, EUROCONTROL Performance Review Unit"
  date: today
  downloads: [pdf, docx]
  chapters:
  - index.qmd
  - 00-foreword.qmd
  - 00-executive-summary.qmd
  - 01-intro.qmd
  - 02-system-overview.qmd
  - 03-traffic_characterisation.qmd
  - 04-predictability.qmd
  - 05-capacity_and_throughput.qmd
  - 06-efficiency.qmd
  # - 07-environment.qmd
  - 09-studies.qmd
  - 10-conclusions.qmd
  - 99-references.qmd
  #appendices:
  #- A1-appendix.qmd

#bibliography: book.bib   #, packages.bib]
bibliography: references.bib

#header-includes:
#  - \setlength{\columnsep}{1cm}

format:
  html:
    theme: cosmo
  pdf:
    documentclass: scrreport
    papersize: a4
    fig-pos: 'H'
    geometry:
    - top=30mm
    - right=25mm
    - left=30mm
    - bottom=30mm
    - heightrounded
    include-in-header:
      text: |
        \usepackage{pdfpages}
        \pagenumbering{gobble}
        \setlength{\columnsep}{1cm}

  docx:
    toc: true
    number-sections: true
    highlight-style: github
